name: Generate LeetCode Heatmap

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Generate LeetCode Heatmap
        env:
          LEETCODE_USERNAME: jagadiswarambati
        run: python scripts/generate_leetcode_heatmap.py

      - name: Commit heatmap
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add leetcode-heatmap.svg

          git diff --cached --quiet || git commit -m "chore: update LeetCode heatmap"

          git push
